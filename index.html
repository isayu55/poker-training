<body>

    <div class="bg-slate-800 rounded-2xl shadow-2xl w-full max-w-lg border border-slate-700 flex flex-col overflow-hidden">
        
        <!-- Header & Nav -->
        <div class="p-5 border-b border-slate-700 bg-slate-800 flex justify-between items-center" style="background-color: rgba(30, 41, 59, 0.5);">
            <div>
                <h1 class="text-2xl font-extrabold tracking-tight gradient-text">Trainer Pro</h1>
                <p class="text-emerald-500 text-xs font-semibold mt-1">10% Rake Optimized</p>
            </div>
            <button onclick="toggleDataModal()" class="text-slate-400 text-sm bg-slate-700 px-3 py-1 rounded">
                ⚙️ Data Sync
            </button>
        </div>

        <div class="tab-container">
            <button class="tab-btn active" onclick="switchTab('quiz', this)">🎲 Quiz</button>
            <button class="tab-btn" onclick="switchTab('chart', this)">📊 Range</button>
            <button class="tab-btn" onclick="switchTab('review', this)">🧠 Review</button>
        </div>

        <!-- ▼ セクション1: クイズ画面 ▼ -->
        <div id="quiz-section" class="section active p-5 pt-2">
            <div class="bg-slate-900 rounded-xl p-4 mb-4 shadow-inner border border-slate-700" style="border-color: rgba(51, 65, 85, 0.5);">
                <!-- 自分のポジション表示 -->
                <div class="text-center mb-4 border-b border-slate-700 pb-3">
                    <span class="text-xs text-slate-400 uppercase tracking-widest font-bold">Your Position</span>
                    <div id="current-pos-label" class="text-4xl font-black text-white mt-1 drop-shadow-md">BTN</div>
                </div>

                <!-- シナリオ・ポジション選択 -->
                <div class="mb-3 flex justify-between items-center">
                    <span class="text-xs text-slate-400 uppercase tracking-widest font-bold">Scenario</span>
                    <select id="scenario-select" class="bg-slate-800 text-sm font-bold text-emerald-400 tracking-wide border border-emerald-500 rounded outline-none p-1" style="border-color: rgba(16, 185, 129, 0.5);">
                        <option value="random">🎲 Random All</option>
                        <option value="open">Open (RFI)</option>
                        <option value="3bet">3-Bet (vs 5BB Open)</option>
                        <option value="3bet_2_5">Defend (vs 2.5BB Open)</option>
                        <option value="mistakes">🧠 Review Mistakes</option>
                    </select>
                </div>
                <div class="flex justify-between items-center">
                    <div>
                        <select id="position-select" class="bg-slate-800 text-sm font-bold text-white tracking-wide border border-slate-600 rounded outline-none p-1 max-w-[140px]"></select>
                    </div>
                    <div class="text-right">
                        <span id="ui-action-to-you" class="text-sm font-bold text-blue-400">Folded</span>
                    </div>
                </div>
<!-- 
                <div id="ui-previous-mistake" class="hidden mt-2 p-2 bg-slate-800 rounded border border-red-500 text-center">
                    <span class="text-xs text-slate-400 font-bold">前回間違えたアクション: </span>
                    <span id="ui-prev-action" class="text-sm font-black text-red-400"></span>
                </div> -->
            </div>

            <!-- Cards Display -->
            <div class="flex justify-center space-x-6 mb-6" style="min-height: 130px;" id="ui-cards-container"></div>

            <!-- Feedback Area -->
            <div id="ui-feedback" class="hidden rounded-xl p-5 mb-4 text-center shadow-lg border border-slate-700">
                <h2 id="feedback-title" class="text-xl font-bold mb-2"></h2>
                <div class="w-full bg-slate-700 rounded-full flex overflow-hidden border border-slate-600 mb-2" style="height: 1.5rem;">
                    <div id="bar-raise" class="color-raise flex items-center justify-center text-xs font-bold text-slate-900" style="width: 0%; transition: width 0.5s;"></div>
                    <div id="bar-call" class="color-call flex items-center justify-center text-xs font-bold text-slate-900" style="width: 0%; transition: width 0.5s;"></div>
                    <div id="bar-fold" class="color-fold flex items-center justify-center text-xs font-bold text-white" style="width: 0%; transition: width 0.5s;"></div>
                </div>
                <p id="feedback-message" class="text-sm opacity-90 mb-4"></p>
                <!-- チャートタブへ飛ぶボタンに変更 -->
                <button onclick="openChartForCurrentPos()" class="w-full bg-slate-800 border border-slate-600 text-slate-300 py-2 rounded-lg text-sm mb-2">
                    📊 View Range Chart for this Position
                </button>
            </div>

            <!-- Action Controls -->
            <div id="ui-controls" class="grid grid-cols-3 gap-2 mb-2">
                <button onclick="handleAction('fold')" class="color-fold text-white py-4 rounded-xl font-bold text-lg shadow-md">Fold</button>
                <button id="btn-call" onclick="handleAction('call')" class="color-call text-slate-900 py-4 rounded-xl font-bold text-lg shadow-md">Call</button>
                <button id="btn-raise" onclick="handleAction('raise')" class="color-raise text-slate-900 py-4 rounded-xl font-bold text-lg shadow-md">Raise</button>
            </div>

            <button id="btn-next" onclick="nextHand()" class="hidden w-full bg-slate-700 text-white py-4 rounded-xl font-bold text-lg shadow-md mt-2">
                Next Hand
            </button>

            <!-- Stats -->
            <div class="mt-6 text-center py-3 rounded-lg border flex justify-between px-6" style="background-color: rgba(15, 23, 42, 0.5); border-color: rgba(51, 65, 85, 0.5);">
                <div>
                    <span class="text-xs text-slate-400 uppercase tracking-widest font-bold block">Correct</span>
                    <div class="text-xl font-black text-emerald-400 mt-1" id="ui-score-correct">0</div>
                </div>
                <div>
                    <span class="text-xs text-slate-400 uppercase tracking-widest font-bold block">Total</span>
                    <div class="text-xl font-black text-white mt-1" id="ui-score-total">0</div>
                </div>
                <div>
                    <span class="text-xs text-slate-400 uppercase tracking-widest font-bold block">Accuracy</span>
                    <div class="text-xl font-black text-blue-400 mt-1"><span id="ui-score-percent">0</span>%</div>
                </div>
            </div>
        </div>

        <!-- ▼ セクション2: チャート画面 ▼ -->
        <div id="chart-section" class="section p-5 pt-2">
            <h2 class="text-xl font-bold mb-4 text-emerald-400">Hand Range Chart</h2>

            <div class="bg-slate-900 rounded-xl p-4 mb-4 shadow-inner border border-slate-700" style="border-color: rgba(51, 65, 85, 0.5);">
                <div class="mb-3 flex justify-between items-center">
                    <span class="text-xs text-slate-400 uppercase tracking-widest font-bold">Scenario</span>
                    <select id="chart-scenario-select" class="bg-slate-800 text-sm font-bold text-emerald-400 tracking-wide border border-emerald-500 rounded outline-none p-1">
                        <option value="open">Open (RFI)</option>
                        <option value="3bet">3-Bet (vs 5BB Open)</option>
                        <option value="3bet_2_5">Defend (vs 2.5BB Open)</option>
                    </select>
                </div>
                <div class="flex justify-between items-center">
                    <span class="text-xs text-slate-400 uppercase tracking-widest font-bold block mb-1">Position</span>
                    <select id="chart-position-select" class="bg-slate-800 text-sm font-bold text-white tracking-wide border border-slate-600 rounded outline-none p-1 max-w-[140px]"></select>
                </div>
            </div>

            <div id="range-grid" class="range-grid mb-4"></div>
        </div>

        <!-- ▼ セクション3: レビュー画面 ▼ -->
        <div id="review-section" class="section p-5 pt-2">
            <h2 class="text-xl font-bold mb-4 text-emerald-400">Mistakes List</h2>
            <button onclick="startReviewQuiz()" class="w-full bg-emerald-600 text-white font-bold py-3 rounded-lg mb-4 shadow-md">
                🎯 間違えた問題だけを復習する
            </button>
            <div class="overflow-x-auto bg-slate-900 rounded-lg border border-slate-700 p-2">
                <table class="mistake-table">
                    <thead><tr><th>Scenario</th><th>Pos</th><th>Hand</th><th>Mistake</th></tr></thead>
                    <tbody id="mistake-list-body"></tbody>
                </table>
            </div>
        </div>

    <!-- Data Management Modal -->
    <div id="data-modal" class="fixed inset-0 flex items-center justify-center hidden z-50 p-4 bg-black-80">
        <div class="bg-slate-800 rounded-xl border border-slate-600 p-6 w-full max-w-md shadow-2xl relative">
            <button onclick="toggleDataModal()" class="absolute top-4 right-4 text-slate-400 text-xl" style="background:none;">✖</button>
            <h2 class="text-xl font-bold mb-4 text-emerald-400">Spreadsheet Sync</h2>
            <p class="text-xs text-slate-400 mb-4">スプレッドシートへの保存・復元ができます。間違えた問題数: <span id="mistake-count-display" class="font-bold text-white">0</span></p>
            
            <button onclick="copyMistakesTSV()" class="w-full bg-blue-600 text-white font-bold py-2 rounded mb-4 text-sm">

            <div class="mb-2">
                <label class="text-xs font-bold text-slate-400">スプシから復元 (インポート):</label>

            </div>
            <button onclick="importMistakesTSV()" class="w-full bg-emerald-600 text-white font-bold py-2 rounded mb-2 text-sm">
                📥 貼り付けたデータを復元
            </button>
            <button onclick="clearMistakes()" class="w-full border font-bold py-2 rounded text-sm mt-4 text-red-400" style="background-color: rgba(127, 29, 29, 0.5); border-color: #b91c1c;">
                🗑️ 間違えた問題リストをリセット
            </button>
        </div>
    </div>

": 0, "fold": 0 }, "AQs": { "raise": 100, "call": 0, "fold": 0 }, "AJs": { "raise": 60, "call": 0, "fold": 40 }, "ATs": { "raise": 30, "call": 0, "fold": 70 }, "A5s": { "raise": 30, "call": 0, "fold": 70 }, "A4s": { "raise": 10, "call": 0, "fold": 90 }, "AKo": { "raise": 100, "call": 0, "fold": 0 }, "KK": { "raise": 100, "call": 0, "fold": 0 }, "KQs": { "raise": 30, "call": 0, "fold": 70 }, "KJs": { "raise": 10, "call": 0, "fold": 90 }, "AQo": { "raise": 60, "call": 0, "fold": 40 }, "QQ": { "raise": 100, "call": 0, "fold": 0 }, "JJ": { "raise": 60, "call": 0, "fold": 40 }, "TT": { "raise": 30, "call": 0, "fold": 70 }, "99": { "raise": 10, "call": 0, "fold": 90 } } };

        // ==========================================

        function copyMistakesTSV() {
            if(mistakes.length === 0) return alert("エクスポートする間違えた問題がありません。");
            let tsv = "Scenario\tPosition\tHand\n";
            mistakes.forEach(m => tsv += `${m.scenario}\t${m.pos}\t${m.hand}\n`);
            navigator.clipboard.writeText(tsv).then(() => alert("スプレッドシート用にコピーしました！\nスプレッドシートのA1セルを選択して貼り付け(Ctrl+V)してください。"));
        }

        function importMistakesTSV() {
            const text = document.getElementById('import-tsv').value.trim();
            if(!text) return;
            const lines = text.split('\n');
            let imported = 0;
            lines.forEach((line, i) => {
                if(i === 0 && line.includes('Scenario')) return;
                const cols = line.split('\t');
                if(cols.length === 3) {
                    mistakes.push({ scenario: cols[0].trim(), pos: cols[1].trim(), hand: cols[2].trim() });
                    imported++;
                }
            });
            localStorage.setItem('poker_mistakes', JSON.stringify(mistakes));
            alert(`${imported} 件の問題を復元しました。`);
            document.getElementById('import-tsv').value = "";
            toggleDataModal();

            } else {
                currentScenarioType = type;
            }

            posSelect.innerHTML = `<option value="random">🎲 Random Position</option>`;

                options = [{val: "HJ_vs_UTG", text: "HJ vs UTG 5BB"}, {val: "BTN_vs_UTG", text: "BTN vs UTG 5BB"}, {val: "SB_vs_BTN", text: "SB vs BTN 5BB"}, {val: "BB_vs_BTN", text: "BB vs BTN 5BB"}, {val: "BB_vs_UTG", text: "BB vs UTG 5BB"}];

            options.forEach(opt => {
                const isSelected = (opt.val === currentPosKey && type !== 'random') ? 'selected' : '';
                posSelect.innerHTML += `<option value="${opt.val}" ${isSelected}>${opt.text}</option>`;
            });

            if (type === 'random' || posSelect.value === 'random') {
                currentPosKey = options[Math.floor(Math.random() * options.length)].val;

            document.getElementById('current-pos-label').innerText = currentPosKey.replace('_2.5', '').replace(/_/g, ' ');

        function toggleCallButton(show) {
            const btnCall = document.getElementById('btn-call');
            const controls = document.getElementById('ui-controls');
            if (show) {
                btnCall.style.display = 'block';
                controls.className = "grid grid-cols-3 gap-2 mb-2";
            } else {
                btnCall.style.display = 'none';
                controls.className = "grid grid-cols-2 gap-4 mb-2";
            }
        }

        function getRandomHandNotation() {
            const r1Idx = Math.floor(Math.random() * ranks.length);
            const r2Idx = Math.floor(Math.random() * ranks.length);
            let rank1 = ranks[Math.min(r1Idx, r2Idx)];
            let rank2 = ranks[Math.max(r1Idx, r2Idx)];
            if (rank1 === rank2) return rank1 + rank2; 
            return rank1 + rank2 + (Math.random() > 0.5 ? 's' : 'o'); 
        }

        function generateCardObjects(notation) {
            const isSuited = notation.endsWith('s');
            let suit1 = suits[Math.floor(Math.random() * suits.length)];
            let suit2 = isSuited ? suit1 : suits.filter(s => s.name !== suit1.name)[Math.floor(Math.random() * 3)];
            return [{ rank: notation[0], suit: suit1 }, { rank: notation[1], suit: suit2 }];
        }

        function nextHand() {
            document.getElementById('ui-feedback').classList.add('hidden');
            document.getElementById('ui-controls').classList.remove('hidden');
            document.getElementById('btn-next').classList.add('hidden');

            // const prevMistakeUI = document.getElementById('ui-previous-mistake');
            // if (prevMistakeUI) prevMistakeUI.classList.add('hidden');

            if(scenarioSelect.value === 'mistakes') {
                if(mistakes.length === 0) {
                    alert("間違えた問題がありません！素晴らしい！");
                    scenarioSelect.value = "random";
                    updatePositionDropdown();
                    nextHand();
                    return;
                }
                const randomIdx = Math.floor(Math.random() * mistakes.length);
                currentMistakeItem = mistakes[randomIdx];
                currentScenarioType = currentMistakeItem.scenario;
                currentPosKey = currentMistakeItem.pos;
                currentHandNotation = currentMistakeItem.hand;
                
                let bbInfo = currentScenarioType === '3bet_2_5' ? "2.5BB" : "5BB";
                actionToYouText.innerText = `Review: Facing ${bbInfo} Open`;
                toggleCallButton(currentScenarioType === '3bet_2_5');

                // ▼ 追加: 前回間違えたアクションを表示 ▼
                // if (currentMistakeItem.wrongAction && prevMistakeUI) {
                //     prevMistakeUI.classList.remove('hidden');
                //     document.getElementById('ui-prev-action').innerText = currentMistakeItem.wrongAction.toUpperCase();
                // }
                document.getElementById('current-pos-label').innerText = currentPosKey.replace('_2.5', '').replace(/_/g, ' ');
            } else {
                if(scenarioSelect.value === 'random' || posSelect.value === 'random') {
                    updatePositionDropdown(); 
                } else {
                    currentPosKey = posSelect.value;
                }
                currentHandNotation = getRandomHandNotation();
                currentMistakeItem = null;
            }

            document.getElementById('ui-cards-container').innerHTML = generateCardObjects(currentHandNotation).map(card => `
                <div class="playing-card">
                    <div class="card-top ${card.suit.color}"><span>${card.rank}</span><span class="suit-icon">${card.suit.symbol}</span></div>
                    <div class="card-center ${card.suit.color}">${card.suit.symbol}</div>
                    <div class="card-bottom ${card.suit.color}"><span>${card.rank}</span><span class="suit-icon">${card.suit.symbol}</span></div>
                </div>`).join('');
        }

        function getDataToUse() {
            if (currentScenarioType === 'open') return rangeDataOpen;
            if (currentScenarioType === '3bet') return rangeData3Bet;
            return rangeData3Bet2_5;
        }

        // ▼ GASのウェブアプリURLをここに貼り付けます ▼
        const GAS_WEBAPP_URL = "https://script.google.com/macros/s/AKfycbx0rApYzsYgE75Km10HOnU0kAaxCJMyFE3D4kXihUd5hX3VvTYNOE6Id4Gj5bwwZYLV/exec";

        function handleAction(userAction) {
        let dataToUse = getDataToUse();
        let correctData = dataToUse[currentPosKey][currentHandNotation] || { raise: 0, call: 0, fold: 100 };
        if(correctData.call === undefined) correctData.call = 0; 

        const isCorrect = correctData[userAction] > 0;
        stats.total++;
        if (isCorrect) stats.correct++;

        // ▼ 追加: GAS (Google Spreadsheet) へ非同期で自動保存 ▼
        if (typeof GAS_WEBAPP_URL !== 'undefined' && GAS_WEBAPP_URL) {
            let postData = {
                scenario: currentScenarioType,
                pos: currentPosKey,
                hand: currentHandNotation,
                userAction: userAction
            };

            // 成功アプリと全く同じ形式（x-www-form-urlencoded 用の文字列化）
            let payload = "data=" + encodeURIComponent(JSON.stringify(postData));

            fetch(GAS_WEBAPP_URL, {
                method: 'POST',
                headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
                body: payload
            })
            .then(response => response.text())
            .then(text => {
                console.log("スプシ送信結果:", text);
            })
            .catch(err => console.error("通信エラー:", err));
        }

        // ▼ 修正: 間違えた問題に userAction (wrongAction) も含めて記録する ▼
        if (!isCorrect && scenarioSelect.value !== 'mistakes') {
            const existingIdx = mistakes.findIndex(m => m.scenario === currentScenarioType && m.pos === currentPosKey && m.hand === currentHandNotation);
            if (existingIdx === -1) {
                mistakes.push({ scenario: currentScenarioType, pos: currentPosKey, hand: currentHandNotation, wrongAction: userAction });
            } else {
                mistakes[existingIdx].wrongAction = userAction; // 上書き更新
            }
            localStorage.setItem('poker_mistakes', JSON.stringify(mistakes));
        } else if (isCorrect && scenarioSelect.value === 'mistakes') {
            mistakes = mistakes.filter(m => !(m.scenario === currentMistakeItem.scenario && m.pos === currentMistakeItem.pos && m.hand === currentMistakeItem.hand));
            localStorage.setItem('poker_mistakes', JSON.stringify(mistakes));
        }

            // Stats UI
            document.getElementById('ui-score-correct').innerText = stats.correct;
            document.getElementById('ui-score-total').innerText = stats.total;
            document.getElementById('ui-score-percent').innerText = Math.round((stats.correct / stats.total) * 100);

            // Toggle UI
            document.getElementById('ui-controls').classList.add('hidden');
            document.getElementById('btn-next').classList.remove('hidden');
            
            const feedbackEl = document.getElementById('ui-feedback');
            feedbackEl.classList.remove('hidden');
            
            const titleEl = document.getElementById('feedback-title');
            if (isCorrect) {
                feedbackEl.style.borderColor = "#10b981";
                feedbackEl.style.backgroundColor = "rgba(16, 185, 129, 0.1)";
                titleEl.style.color = "#34d399";
                titleEl.innerText = "Correct! 🎉";
            } else {
                feedbackEl.style.borderColor = "#ef4444";
                feedbackEl.style.backgroundColor = "rgba(239, 68, 68, 0.1)";
                titleEl.style.color = "#f87171";
                titleEl.innerText = "Incorrect ❌";
            }

            // Animate Frequency Bar
            const bR = document.getElementById('bar-raise'), bC = document.getElementById('bar-call'), bF = document.getElementById('bar-fold');
            bR.style.width = '0%'; bC.style.width = '0%'; bF.style.width = '0%';
            
            setTimeout(() => {
                bR.style.width = `${correctData.raise}%`; bR.innerText = correctData.raise > 0 ? `${correctData.raise}% R` : '';
                bC.style.width = `${correctData.call}%`; bC.innerText = correctData.call > 0 ? `${correctData.call}% C` : '';
                bF.style.width = `${correctData.fold}%`; bF.innerText = correctData.fold > 0 ? `${correctData.fold}% F` : '';
            }, 50);

            let actionType = currentScenarioType === 'open' ? 'Open' : (currentScenarioType === '3bet' ? '3-Bet' : 'Raise');
            let message = `${currentHandNotation} is `;
            if(correctData.raise > 0) message += `<span class="text-raise font-bold">${correctData.raise}% ${actionType}</span> `;
            if(correctData.call > 0) message += `/ <span class="text-call font-bold">${correctData.call}% Call</span> `;
            if(correctData.fold > 0) message += `/ <span style="color: #60a5fa;" class="font-bold">${correctData.fold}% Fold</span> `;
            
            let posLabel = currentPosKey.replace('_2.5', '').replace(/_/g, ' ');
            document.getElementById('feedback-message').innerHTML = message + `<br><span class="text-xs text-slate-400">(${posLabel})</span>`;
        }

        // ==========================================

        let chartScenarioType = "open";
        let chartPosKey = "UTG";
        const chartScenarioSelect = document.getElementById('chart-scenario-select');
        const chartPositionSelect = document.getElementById('chart-position-select');

        function updateChartPositionDropdown() {
            chartScenarioType = chartScenarioSelect.value;
            chartPositionSelect.innerHTML = "";
            let options = [];

            if (chartScenarioType === 'open') {
                options = [{val: "UTG", text: "UTG"}, {val: "HJ", text: "HJ"}, {val: "CO", text: "CO"}, {val: "BTN", text: "BTN"}];
            } else if (chartScenarioType === '3bet') {
                options = [{val: "HJ_vs_UTG", text: "HJ vs UTG 5BB"}, {val: "BTN_vs_UTG", text: "BTN vs UTG 5BB"}, {val: "SB_vs_BTN", text: "SB vs BTN 5BB"}, {val: "BB_vs_BTN", text: "BB vs BTN 5BB"}, {val: "BB_vs_UTG", text: "BB vs UTG 5BB"}];
            } else if (chartScenarioType === '3bet_2_5') {
                options = [{val: "HJ_vs_UTG_2.5", text: "HJ vs UTG 2.5BB"}, {val: "BTN_vs_UTG_2.5", text: "BTN vs UTG 2.5BB"}, {val: "SB_vs_BTN_2.5", text: "SB vs BTN 2.5BB"}, {val: "BB_vs_BTN_2.5", text: "BB vs BTN 2.5BB"}, {val: "BB_vs_UTG_2.5", text: "BB vs UTG 2.5BB"}];
            }

            let found = options.find(o => o.val === chartPosKey);
            if(!found) chartPosKey = options[0].val;

            options.forEach(opt => {
                const isSelected = (opt.val === chartPosKey) ? 'selected' : '';
                chartPositionSelect.innerHTML += `<option value="${opt.val}" ${isSelected}>${opt.text}</option>`;
            });
            renderGrid();
        }

        function openChartForCurrentPos() {
            if (currentScenarioType !== 'mistakes' && currentScenarioType !== 'random') {
                chartScenarioSelect.value = currentScenarioType;
                updateChartPositionDropdown();
                chartPositionSelect.value = currentPosKey;
                chartPosKey = currentPosKey;
                renderGrid();
            }
            document.querySelectorAll('.tab-btn')[1].click(); 
        }

        chartScenarioSelect.addEventListener('change', updateChartPositionDropdown);
        chartPositionSelect.addEventListener('change', () => {
            chartPosKey = chartPositionSelect.value;
            renderGrid();
        });

        // 既存の renderGrid() を以下に書き換え
        function renderGrid() {
            const grid = document.getElementById('range-grid');
            if(!grid) return;
            grid.innerHTML = '';
            
            let dataToUse;
            if (chartScenarioType === 'open') dataToUse = rangeDataOpen;
            else if (chartScenarioType === '3bet') dataToUse = rangeData3Bet;
            else dataToUse = rangeData3Bet2_5;
            
            const dataSet = dataToUse[chartPosKey] || {};

            for(let i=0; i<13; i++) {
                for(let j=0; j<13; j++) {
                    let handStr = "";
                    if(i===j) handStr = ranks[i] + ranks[j];
                    else if(i<j) handStr = ranks[i] + ranks[j] + 's';
                    else handStr = ranks[j] + ranks[i] + 'o';

                    let cellData = dataSet[handStr] || {raise: 0, call: 0, fold: 100};
                    if(cellData.call === undefined) cellData.call = 0;
                    
                    let r = cellData.raise, c = cellData.call, f = cellData.fold;
                    let bg = `linear-gradient(to right, #ff9a9e ${r}%, #a8e6cf ${r}% ${r+c}%, #3b82f6 ${r+c}% 100%)`;
                    let textColor = f > 60 ? '#fff' : '#111';

                    grid.innerHTML += `
                        <div class="grid-cell" style="background: ${bg}; color: ${textColor};">
                            ${handStr}
                            <div class="tooltip">Raise: ${r}% | Call: ${c}% | Fold: ${f}%</div>
                        </div>
                    `;
                }
            }
        }

        // タブ切り替え制御

            document.querySelectorAll('.section').forEach(el => el.classList.remove('active'));
            document.querySelectorAll('.tab-btn').forEach(el => el.classList.remove('active'));
            
            document.getElementById(`${tabId}-section`).classList.add('active');
            btnElement.classList.add('active');

            if (tabId === 'chart') {
                renderGrid(); // タブを開いた時に現在のレンジを描画
            } else if (tabId === 'review') {
                renderMistakeList(); // リストを描画
            }
        }

        // 間違えた問題一覧の描画
        function renderMistakeList() {
            const tbody = document.getElementById('mistake-list-body');
            tbody.innerHTML = '';
            if (mistakes.length === 0) {
                tbody.innerHTML = '<tr><td colspan="4" class="text-center py-6 text-slate-400">間違えた問題はありません🎉</td></tr>';
                return;
            }
            mistakes.forEach(m => {
                tbody.innerHTML += `<tr>
                    <td class="text-xs">${m.scenario.replace('_', ' ')}</td>
                    <td class="font-bold text-white">${m.pos.replace('_2.5','')}</td>
                    <td class="text-blue-400 font-bold">${m.hand}</td>
                    <td class="text-red-400 font-bold">${m.wrongAction ? m.wrongAction.toUpperCase() : '-'}</td>
                </tr>`;
            });
        }

        // レビュータブから復習モードを開始する
        function startReviewQuiz() {
            if(mistakes.length === 0) return alert("間違えた問題がありません！");
            scenarioSelect.value = 'mistakes';
            updatePositionDropdown();
            updateChartPositionDropdown();
            nextHand();
            // クイズタブに戻る
            document.querySelector('.tab-btn').click(); 
        }

        // Event Listeners
        posSelect.addEventListener('change', () => { 
            if(scenarioSelect.value !== 'random' && scenarioSelect.value !== 'mistakes') { 
                currentPosKey = posSelect.value; 
            }
            nextHand(); 
        });
        scenarioSelect.addEventListener('change', () => { 
            updatePositionDropdown(); 
            nextHand(); 
        });
        

        // Init
        updatePositionDropdown();
        nextHand();
    </script>
</body>
</html>
